<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerenciador para armazenar tarefas">
    <meta name="keywords" content="tarefas, lista de tarefas, ToDo, gerenciador">
    <meta name="author" content="@sacradev">
    <meta name="robots" content="index, follow">

    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Gerenciador de Tarefas</h1>

        <form id="task-form">
            <input id="title" type="text" placeholder="Digite uma tarefa" required>
            <input id="description" type="text" placeholder="Descreva a tarefa">
            <button type="submit">Adicionar</button>
        </form>

        <ul id="task-list">
        </ul>
    </main>
    <script src="./script.js"></script>
</body>

</html>
